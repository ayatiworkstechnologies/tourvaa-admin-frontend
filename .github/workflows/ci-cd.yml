name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET || 'http://backend:8000' }}
  NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8000' }}

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Cross-repo API contract check (tests/api-contract.test.mjs) needs the
      # backend checked out as a sibling directory (../tourvaa-admin-backend)
      # and a Python env it can import `app.main` from - see ENV-01 in
      # _audit_tools/CONSOLIDATED-BUG-REPORT.md. Requires a PAT with read
      # access to tourvaa-admin-backend stored as the BACKEND_CHECKOUT_TOKEN
      # secret (the default GITHUB_TOKEN can't reach a sibling repo); without
      # it this step is skipped and the contract test falls back to its
      # existing single-repo skip instead of failing the build.
      - name: Check backend checkout token availability
        id: backend_token
        run: echo "available=${{ secrets.BACKEND_CHECKOUT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout sibling backend repo
        if: steps.backend_token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: ayatiworkstechnologies/tourvaa-admin-backend
          token: ${{ secrets.BACKEND_CHECKOUT_TOKEN }}
          path: ../tourvaa-admin-backend

      - name: Set up backend Python for contract check
        if: steps.backend_token.outputs.available == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ../tourvaa-admin-backend/requirements.txt

      - name: Install backend deps for contract check
        if: steps.backend_token.outputs.available == 'true'
        working-directory: ../tourvaa-admin-backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Contract tests (tests/run-tests.mjs)
        run: node tests/run-tests.mjs
        env:
          # Only needed for app.main to import cleanly - no DB/Redis is
          # actually queried to build the OpenAPI schema, so a reachable
          # database is not required here.
          TOURVAA_TEST_PYTHON: python
          DATABASE_URL: mysql+pymysql://tourvaa:tourvaa_ci@127.0.0.1:3306/tourvaa_ci
          JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-characters
          SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPER_ADMIN_EMAIL: admin@tourvaa.com
          SUPER_ADMIN_PASSWORD: Admin@123
          APP_ENV: development
          FRONTEND_URL: http://127.0.0.1:3000
          ALLOWED_ORIGINS: http://127.0.0.1:3000
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Type-check
        run: npx tsc --noEmit
      - run: npm run build
        env:
          API_PROXY_TARGET: ${{ env.API_PROXY_TARGET }}
          NEXT_PUBLIC_WS_URL: ${{ env.NEXT_PUBLIC_WS_URL }}
      - name: Install browser for production smoke checks
        run: npx playwright install --with-deps chromium
      - name: Production browser smoke checks
        run: npx playwright test e2e/audit-regressions.spec.ts
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/

  container:
    name: Build, scan and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tourvaa-frontend-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_PROXY_TARGET=${{ env.API_PROXY_TARGET }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publication
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: tourvaa-frontend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            API_PROXY_TARGET=${{ env.API_PROXY_TARGET }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
