name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET || 'http://backend:8000' }}
  NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8000' }}

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Contract - module-routes
        if: always()
        run: node tests/module-routes.test.mjs
      - name: Contract - module-services
        if: always()
        run: node tests/module-services.test.mjs
      - name: Contract - module-permissions
        if: always()
        run: node tests/module-permissions.test.mjs
      - name: Contract - module-components
        if: always()
        run: node tests/module-components.test.mjs
      - name: Contract - dashboard
        if: always()
        run: node tests/dashboard.test.mjs
      - name: Contract - auth-flow
        if: always()
        run: node tests/auth-flow.test.mjs
      - name: Contract - api-contract
        if: always()
        run: node tests/api-contract.test.mjs
      - name: Contract - currency-flow
        if: always()
        run: node tests/currency-flow.test.mjs
      - name: Contract - calendar-flow
        if: always()
        run: node tests/calendar-flow.test.mjs
      - name: Contract - metadata-flow
        if: always()
        run: node tests/metadata-flow.test.mjs
      - name: Contract - customer-flow
        if: always()
        run: node tests/customer-flow.test.mjs
      - name: Contract - supplier-flow
        if: always()
        run: node tests/supplier-flow.test.mjs
      - name: Contract - agent-flow
        if: always()
        run: node tests/agent-flow.test.mjs
      - name: Contract - admin-flow
        if: always()
        run: node tests/admin-flow.test.mjs
      - name: Contract - overall-flow
        if: always()
        run: node tests/overall-flow.test.mjs
      - name: Contract - responsive-flow
        if: always()
        run: node tests/responsive-flow.test.mjs
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Type-check
        run: npx tsc --noEmit
      - run: npm run build
        env:
          API_PROXY_TARGET: ${{ env.API_PROXY_TARGET }}
          NEXT_PUBLIC_WS_URL: ${{ env.NEXT_PUBLIC_WS_URL }}

  container:
    name: Build, scan and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build scan candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tourvaa-frontend-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_PROXY_TARGET=${{ env.API_PROXY_TARGET }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publication
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: tourvaa-frontend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            API_PROXY_TARGET=${{ env.API_PROXY_TARGET }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
